<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Réseau Santé Mali — Rejoindre l'équipe</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>* { margin:0; padding:0; box-sizing:border-box; } body { background:#F5EDD8; font-family:Georgia,serif; }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const STORAGE_KEY = "leads-rsm-v1";
const ADMIN_PASSWORD = "oumar2025";
const motivations = ["Avoir un revenu complémentaire","Quitter mon emploi actuel","Travailler depuis chez moi","Aider mon entourage avec de bons produits","Construire une équipe et évoluer"];
const disponibilites = ["Moins de 5h / semaine","Entre 5h et 15h / semaine","Plus de 15h / semaine","Je suis disponible à temps plein"];
const canaux = ["WhatsApp","Appel téléphonique","Zoom / Vidéo","En personne"];
const statutColors = {"Nouveau":"#C8860A","Contacté":"#2A7A9A","En discussion":"#6A9A2A","Converti":"#2A7A4A","Non retenu":"#9A2A2A"};
function loadLeads(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")}catch{return[]}}
function saveLeads(l){localStorage.setItem(STORAGE_KEY,JSON.stringify(l))}
function exportCSV(leads){
  const h=["Prénom","Nom","Téléphone","Ville","Motivation","Disponibilité","Canal","Message","Date","Statut"];
  const r=leads.map(l=>[l.prenom,l.nom,l.telephone,l.ville,l.motivation,l.disponibilite,l.canal,(l.message||"").replace(/"/g,"'"),l.date,l.statut].map(v=>`"${v}"`).join(","));
  const blob=new Blob(["\uFEFF"+[h.join(","),...r].join("\n")],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="leads.csv"; a.click();
}
const btn={background:"#C8860A",color:"#fff",border:"none",padding:"14px 28px",borderRadius:8,fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"Georgia,serif"};
const btnG={...btn,background:"transparent",color:"#8B7355",border:"1.5px solid #DDD5C0"};
const inp={width:"100%",boxSizing:"border-box",padding:"12px 14px",background:"#FAFAF7",border:"1.5px solid #DDD5C0",borderRadius:8,fontSize:15,color:"#2A2015",outline:"none",fontFamily:"Georgia,serif"};
const lbl={display:"block",fontSize:12,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",color:"#8B7355",marginBottom:6};
function Field({label,name,type="text",placeholder,value,onChange,error}){return(<div style={{marginBottom:18}}><label style={lbl}>{label}</label><input type={type} value={value} placeholder={placeholder} onChange={e=>onChange(name,e.target.value)} style={{...inp,border:`1.5px solid ${error?"#E07050":"#DDD5C0"}`,background:error?"#fff5f0":"#FAFAF7"}}/>{error&&<p style={{color:"#E07050",fontSize:12,marginTop:4}}>{error}</p>}</div>)}
function Radio({label,name,options,value,onChange,error}){return(<div style={{marginBottom:20}}><label style={lbl}>{label}</label><div style={{display:"flex",flexDirection:"column",gap:8}}>{options.map(o=><div key={o} onClick={()=>onChange(name,o)} style={{padding:"11px 14px",cursor:"pointer",borderRadius:8,fontFamily:"Georgia,serif",fontSize:14,background:value===o?"#2A2015":"#FAFAF7",border:`1.5px solid ${value===o?"#2A2015":"#DDD5C0"}`,color:value===o?"#F5EDD8":"#4A3A25"}}>{o}</div>)}</div>{error&&<p style={{color:"#E07050",fontSize:12,marginTop:4}}>{error}</p>}</div>)}
function App(){
  const [view,setView]=useState("landing");
  const [step,setStep]=useState(1);
  const [leads,setLeads]=useState([]);
  const [pwd,setPwd]=useState("");
  const [unlocked,setUnlocked]=useState(false);
  const [pwdErr,setPwdErr]=useState(false);
  const [form,setForm]=useState({prenom:"",nom:"",telephone:"",ville:"",motivation:"",disponibilite:"",canal:"",message:""});
  const [errors,setErrors]=useState({});
  const [last,setLast]=useState({prenom:"",canal:""});
  useEffect(()=>{setLeads(loadLeads())},[]);
  const upd=(n,v)=>setForm(f=>({...f,[n]:v}));
  function validate(){
    const e={};
    if(step===1){if(!form.prenom.trim())e.prenom="Requis";if(!form.nom.trim())e.nom="Requis";if(!form.telephone.trim())e.telephone="Requis";if(!form.ville.trim())e.ville="Requis";}
    if(step===2&&!form.motivation)e.motivation="Choisissez une option";
    if(step===3){if(!form.disponibilite)e.disponibilite="Choisissez une option";if(!form.canal)e.canal="Choisissez une option";}
    setErrors(e); return Object.keys(e).length===0;
  }
  function next(){if(!validate())return;if(step<3){setStep(s=>s+1);return;}const nl={...form,id:Date.now(),date:new Date().toLocaleDateString("fr-FR"),statut:"Nouveau"};const u=[nl,...leads];setLeads(u);saveLeads(u);setLast({prenom:form.prenom,canal:form.canal});setView("merci");}
  function reset(){setForm({prenom:"",nom:"",telephone:"",ville:"",motivation:"",disponibilite:"",canal:"",message:""});setStep(1);setErrors({});}
  function unlock(){if(pwd===ADMIN_PASSWORD){setUnlocked(true);setPwdErr(false);setLeads(loadLeads())}else setPwdErr(true);}
  function updSt(id,statut){const u=leads.map(l=>l.id===id?{...l,statut}:l);setLeads(u);saveLeads(u);}
  function del(id){if(!confirm("Supprimer ?"))return;const u=leads.filter(l=>l.id!==id);setLeads(u);saveLeads(u);}

  if(view==="landing")return(<div style={{minHeight:"100vh",background:"#F5EDD8",display:"flex",flexDirection:"column"}}>
    <div style={{background:"#2A2015",padding:"14px 24px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <span style={{color:"#C8860A",fontWeight:700,letterSpacing:"0.1em"}}>◆ RÉSEAU SANTÉ MALI</span>
      <button onClick={()=>setView("admin")} style={{background:"transparent",border:"none",color:"#8B7355",cursor:"pointer",fontSize:12}}>Admin →</button>
    </div>
    <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"52px 24px",textAlign:"center"}}>
      <div style={{background:"#C8860A",color:"#fff",fontSize:11,fontWeight:700,letterSpacing:"0.15em",padding:"6px 18px",borderRadius:20,marginBottom:28}}>OPPORTUNITÉ DE REVENU — MALI & AFRIQUE</div>
      <h1 style={{fontSize:"clamp(28px,6vw,52px)",color:"#2A2015",lineHeight:1.2,margin:"0 0 20px",maxWidth:620}}>Construis ton activité.<br/><span style={{color:"#C8860A"}}>À ton rythme.</span></h1>
      <p style={{color:"#6B5A3A",fontSize:17,lineHeight:1.75,maxWidth:500,margin:"0 0 36px"}}>Tu es sérieux·se, motivé·e, et tu veux bâtir quelque chose de concret dans le domaine de la santé et du bien-être ? Remplis ce formulaire — je te contacte personnellement.</p>
      <div style={{display:"flex",gap:12,flexWrap:"wrap",justifyContent:"center",marginBottom:44}}>{["Formation incluse","Travail à distance","Revenus réels","Équipe solidaire"].map(v=><div key={v} style={{background:"#fff",border:"1px solid #DDD5C0",borderRadius:8,padding:"10px 18px",color:"#4A3A25",fontSize:13,fontWeight:600}}>✓ {v}</div>)}</div>
      <button onClick={()=>setView("form")} style={{...btn,padding:"16px 44px",fontSize:16}}>Je suis intéressé·e →</button>
      <p style={{color:"#B0A080",fontSize:12,marginTop:14}}>Formulaire confidentiel · Aucun engagement</p>
    </div>
    <div style={{background:"#2A2015",padding:"28px 24px",textAlign:"center"}}><p style={{color:"#8B7355",fontSize:13,margin:0}}>"Ce n'est pas un schéma rapide. C'est un travail vrai, avec un accompagnement vrai."</p></div>
  </div>);

  if(view==="form")return(<div style={{minHeight:"100vh",background:"#F5EDD8",display:"flex",flexDirection:"column",alignItems:"center",padding:"32px 16px"}}>
    <div style={{width:"100%",maxWidth:520}}>
      <button onClick={()=>{setView("landing");reset();}} style={{background:"transparent",border:"none",color:"#8B7355",cursor:"pointer",fontSize:13,marginBottom:24,padding:0}}>← Retour</button>
      <div style={{display:"flex",gap:8,marginBottom:32}}>{["Profil","Motivation","Disponibilité"].map((label,i)=><div key={label} style={{flex:1,display:"flex",flexDirection:"column",gap:5,alignItems:"center"}}><div style={{height:4,width:"100%",borderRadius:2,background:step>i?"#C8860A":"#DDD5C0"}}/><span style={{fontSize:11,color:step>i?"#C8860A":"#B0A080",fontWeight:600}}>{label}</span></div>)}</div>
      <div style={{background:"#fff",borderRadius:16,padding:"32px 28px",border:"1px solid #DDD5C0",boxShadow:"0 4px 24px rgba(42,32,21,0.08)"}}>
        {step===1&&<><h2 style={{color:"#2A2015",fontSize:22,margin:"0 0 6px"}}>Dis-moi qui tu es</h2><p style={{color:"#8B7355",fontSize:14,margin:"0 0 28px"}}>Ces infos me permettront de te contacter directement.</p><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}><Field label="Prénom" name="prenom" placeholder="Aminata" value={form.prenom} onChange={upd} error={errors.prenom}/><Field label="Nom" name="nom" placeholder="Coulibaly" value={form.nom} onChange={upd} error={errors.nom}/></div><Field label="Téléphone / WhatsApp" name="telephone" type="tel" placeholder="+223 XX XX XX XX" value={form.telephone} onChange={upd} error={errors.telephone}/><Field label="Ville / Région" name="ville" placeholder="Bamako, Ségou, Mopti…" value={form.ville} onChange={upd} error={errors.ville}/></>}
        {step===2&&<><h2 style={{color:"#2A2015",fontSize:22,margin:"0 0 6px"}}>Ta motivation</h2><p style={{color:"#8B7355",fontSize:14,margin:"0 0 28px"}}>Qu'est-ce qui t'attire dans cette opportunité ?</p><Radio label="Ta principale raison" name="motivation" options={motivations} value={form.motivation} onChange={upd} error={errors.motivation}/><div><label style={lbl}>Quelque chose à ajouter ? (facultatif)</label><textarea value={form.message} onChange={e=>upd("message",e.target.value)} placeholder="Ta situation actuelle, tes questions…" rows={3} style={{...inp,resize:"vertical"}}/></div></>}
        {step===3&&<><h2 style={{color:"#2A2015",fontSize:22,margin:"0 0 6px"}}>Disponibilité & contact</h2><p style={{color:"#8B7355",fontSize:14,margin:"0 0 28px"}}>Pour que je sache comment et quand te joindre.</p><Radio label="Temps disponible par semaine" name="disponibilite" options={disponibilites} value={form.disponibilite} onChange={upd} error={errors.disponibilite}/><Radio label="Comment préfères-tu être contacté·e ?" name="canal" options={canaux} value={form.canal} onChange={upd} error={errors.canal}/></>}
        <div style={{display:"flex",justifyContent:"space-between",marginTop:24,gap:12}}>
          {step>1&&<button onClick={()=>setStep(s=>s-1)} style={btnG}>← Précédent</button>}
          <button onClick={next} style={{...btn,marginLeft:"auto",minWidth:160}}>{step===3?"Envoyer ma demande ✓":"Suivant →"}</button>
        </div>
      </div>
      <p style={{color:"#B0A080",fontSize:12,textAlign:"center",marginTop:16}}>Tes informations sont confidentielles et ne seront pas partagées.</p>
    </div>
  </div>);

  if(view==="merci")return(<div style={{minHeight:"100vh",background:"#F5EDD8",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
    <div style={{background:"#fff",borderRadius:20,padding:"48px 36px",textAlign:"center",maxWidth:440,border:"1px solid #DDD5C0",boxShadow:"0 8px 40px rgba(42,32,21,0.1)"}}>
      <div style={{fontSize:48,marginBottom:16}}>✅</div>
      <h2 style={{color:"#2A2015",fontSize:26,margin:"0 0 12px"}}>Demande reçue !</h2>
      <p style={{color:"#6B5A3A",fontSize:16,lineHeight:1.75,margin:"0 0 32px"}}>Merci {last.prenom}. Je vais examiner ton profil et te contacter via {last.canal} dans les prochaines 24h.</p>
      <button onClick={()=>{setView("landing");reset();}} style={btnG}>Retour à l'accueil</button>
    </div>
  </div>);

  if(view==="admin")return(<div style={{minHeight:"100vh",background:"#1A1410",paddingBottom:40}}>
    <div style={{background:"#2A2015",padding:"16px 28px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid #3A3020"}}>
      <span style={{color:"#C8860A",fontWeight:700,letterSpacing:"0.1em"}}>◆ TABLEAU DE BORD — LEADS</span>
      <button onClick={()=>setView("landing")} style={{background:"transparent",border:"none",color:"#8B7355",cursor:"pointer",fontSize:13}}>← Vue publique</button>
    </div>
    {!unlocked?(<div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"80vh"}}>
      <div style={{background:"#2A2015",borderRadius:14,padding:"36px 32px",width:"100%",maxWidth:360,border:"1px solid #3A3020"}}>
        <h3 style={{color:"#F5EDD8",margin:"0 0 20px",fontSize:18}}>Accès réservé</h3>
        <input type="password" placeholder="Mot de passe" value={pwd} onChange={e=>{setPwd(e.target.value);setPwdErr(false);}} onKeyDown={e=>e.key==="Enter"&&unlock()} style={{...inp,background:"#1A1410",border:`1.5px solid ${pwdErr?"#E07050":"#3A3020"}`,color:"#F5EDD8"}}/>
        {pwdErr&&<p style={{color:"#E07050",fontSize:12,marginTop:6}}>Mot de passe incorrect.</p>}
        <button onClick={unlock} style={{...btn,width:"100%",marginTop:16}}>Accéder</button>
      </div>
    </div>):(
      <div style={{padding:"28px 20px",maxWidth:920,margin:"0 auto"}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:14,marginBottom:28}}>
          {[{label:"Total",value:leads.length,color:"#C8860A"},{label:"Nouveaux",value:leads.filter(l=>l.statut==="Nouveau").length,color:"#E0A030"},{label:"En cours",value:leads.filter(l=>["Contacté","En discussion"].includes(l.statut)).length,color:"#4A9ABB"},{label:"Convertis",value:leads.filter(l=>l.statut==="Converti").length,color:"#5ABB7A"}].map(s=>(
            <div key={s.label} style={{background:"#2A2015",borderRadius:10,padding:"18px 20px",border:"1px solid #3A3020"}}>
              <div style={{fontSize:28,fontWeight:700,color:s.color}}>{s.value}</div>
              <div style={{fontSize:12,color:"#8B7355",marginTop:4}}>{s.label}</div>
            </div>
          ))}
        </div>
        {leads.length>0&&<div style={{marginBottom:20,display:"flex",justifyContent:"flex-end"}}><button onClick={()=>exportCSV(leads)} style={{...btnG,padding:"10px 20px",fontSize:13,color:"#C8860A",border:"1px solid #C8860A"}}>⬇ Exporter CSV</button></div>}
        {leads.length===0?(<div style={{textAlign:"center",color:"#6B5A3A",padding:"60px 0",background:"#2A2015",borderRadius:12}}><div style={{fontSize:40,marginBottom:12}}>📭</div><p>Aucun lead pour le moment.</p></div>):(
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {leads.map(lead=>(
              <div key={lead.id} style={{background:"#2A2015",borderRadius:12,padding:"20px 22px",border:"1px solid #3A3020"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10,marginBottom:10}}>
                  <div><div style={{color:"#F5EDD8",fontWeight:700,fontSize:16}}>{lead.prenom} {lead.nom}</div><div style={{color:"#8B7355",fontSize:13,marginTop:2}}>{lead.telephone} · {lead.ville} · {lead.date}</div></div>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <select value={lead.statut} onChange={e=>updSt(lead.id,e.target.value)} style={{background:"#1A1410",border:`1px solid ${statutColors[lead.statut]||"#3A3020"}`,color:statutColors[lead.statut]||"#F5EDD8",borderRadius:6,padding:"5px 10px",fontSize:12,cursor:"pointer",fontFamily:"Georgia,serif"}}>
                      {Object.keys(statutColors).map(st=><option key={st} value={st}>{st}</option>)}
                    </select>
                    <button onClick={()=>del(lead.id)} style={{background:"transparent",border:"1px solid #5A3020",color:"#9A5A4A",borderRadius:6,padding:"5px 10px",cursor:"pointer",fontSize:12}}>✕</button>
                  </div>
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:8}}>{[lead.motivation,lead.disponibilite,lead.canal].filter(Boolean).map((t,i)=><span key={i} style={{background:"#1A1410",border:"1px solid #3A3020",color:"#B0A080",borderRadius:20,padding:"3px 10px",fontSize:12}}>{t}</span>)}</div>
                {lead.message&&<p style={{color:"#8B7355",fontSize:13,margin:"10px 0 0",fontStyle:"italic",borderLeft:"2px solid #3A3020",paddingLeft:12}}>"{lead.message}"</p>}
              </div>
            ))}
          </div>
        )}
      </div>
    )}
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
